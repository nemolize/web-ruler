name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue production deploys so a rapid second push cannot cancel an
  # in-flight deploy; preview uploads are safe to supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pull-requests: write` is needed only by the sticky-comment steps, which
    # are themselves gated on `github.event_name == 'pull_request'`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: "Version Preview URL: ⏳deployment is in progress..."

      - uses: actions/checkout@v6
      - uses: nemolize/actions/setup@ffbe3737f01cb4e563dd19424761da8c3c9a9173 # v1.2.0

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - uses: nemolize/set-wrangler-name@v1
      - run: pnpm exec opennextjs-cloudflare build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Unset, OpenNext resolves the account via /memberships — a user-level
          # endpoint an account token cannot call, so the build fails there.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: deploy
        name: Deploy
        run: |
          OUTPUT=$(pnpm exec opennextjs-cloudflare ${{ github.event_name == 'pull_request' && 'upload' || 'deploy' }})
          echo "$OUTPUT"
          echo "preview_line=$(echo "$OUTPUT" | grep "Version Preview URL:")" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add preview URL comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.deploy.outputs.preview_line }}
